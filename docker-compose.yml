services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: libradesk
      POSTGRES_USER: ${DATABASE_USER:-libradesk}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-libradesk}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-libradesk}"]
      interval: 5s
      timeout: 3s
      retries: 15
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["1025:1025", "8025:8025"]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/libradesk
      DATABASE_USER: ${DATABASE_USER:-libradesk}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-libradesk}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    ports: ["3000:80"]
    depends_on: [backend]
volumes:
  pgdata:
